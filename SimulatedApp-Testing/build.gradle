//
// build.gradle in SimulatedApp-Testing
//
// What a plain-JVM test or dashboard session needs to run vision OpModes: PlainJvmVision, which
// supplies the Android pieces Robolectric does not, and DashboardHost, the Robolectric "test" a
// dashboard session runs inside. Test support, so a team depends on it with testImplementation
// and nothing here reaches an APK.
//
// Robolectric and JUnit 4 are api: DashboardHost runs under RobolectricTestRunner, and a team's
// own vision tests use the same runner.
//

apply plugin: 'com.android.library'

android {
    namespace = 'org.ngicollective.ftcsim.app.testing'

    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

apply from: '../gradle/sdk.gradle'

dependencies {
    api project(':Dashboard')

    api 'org.robolectric:robolectric:4.12.2'
    api 'junit:junit:4.13.2'
    // Robolectric 4.12.2 instruments classes with ASM 9.7, which cannot read Java 25 class files,
    // so a team whose Gradle JDK is 25 fails every vision test. 9.11 can. Robolectric itself stays:
    // 4.17's WifiManager shadow names android.net.wifi.BlockingOption, which compile SDK 34's
    // android.jar does not have.
    api 'org.ow2.asm:asm:9.11'
    api 'org.ow2.asm:asm-analysis:9.11'
    api 'org.ow2.asm:asm-commons:9.11'
    api 'org.ow2.asm:asm-tree:9.11'
    api 'org.ow2.asm:asm-util:9.11'

    // PlainJvmVision stands in an OpModeManagerImpl the SDK reaches for and nothing here drives.
    // 5.24.0's Byte Buddy supports Java 25; 5.11.0's stopped at 22.
    implementation 'org.mockito:mockito-core:5.24.0'
}

// Published as org.ngi-collective.ftc-sim:testing; see gradle/publish.gradle.
ext.ftcSimArtifact = 'testing'
ext.ftcSimDescription = "Plain-JVM vision support and the dashboard host, for a team's simulated tests."
apply from: '../gradle/publish.gradle'

mavenPublishing {
    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary(
            new com.vanniktech.maven.publish.JavadocJar.Empty(),
            new com.vanniktech.maven.publish.SourcesJar.Sources(), 'release'))
}
