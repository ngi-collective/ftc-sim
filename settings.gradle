pluginManagement {
    // The simulator's own Gradle plugin, applied by TeamCode as org.ngi-collective.ftc-sim.
    includeBuild('build-logic')

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

include ':FtcRobotController'
include ':TeamCode'
include ':TestFramework'
include ':Season-BioBuzz'
include ':SimulatedApp'
include ':SimulatedApp-Testing'
include ':Dashboard'
include ':AndroidShims'
include ':CameraStream'

// Packaging-only projects for the two artifacts that are not libraries; see each build file.
include ':publishing-app'
project(':publishing-app').projectDir = file('publishing/app')
include ':publishing-vision-natives'
project(':publishing-vision-natives').projectDir = file('publishing/vision-natives')
