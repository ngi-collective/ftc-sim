name: Vision natives

# Builds vision-natives-<os>-<arch>.jar on each platform a team develops on, so that a machine
# with no C compiler can still run vision tests: `buildVisionNatives` unpacks the jar for its host
# when it is given one (-PvisionNativesJar=... or libs/vision-natives/), and compiles only when it
# is not. See build.gradle and tools/build-vision-natives.sh.
#
# The jars are uploaded as workflow artifacts; release.yml calls this workflow, collects them, and
# publishes them as classifiers of org.ngi-collective.ftc-sim:vision-natives.

on:
  # Called by release.yml, which publishes the jars with everything else at one version.
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-vision-natives.sh
      - tools/vision-natives/**
      - .github/workflows/vision-natives.yml

permissions:
  contents: read

jobs:
  natives:
    name: ${{ matrix.classifier }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, classifier: linux-x86_64, shell: bash }
          - { runner: ubuntu-24.04-arm, classifier: linux-aarch64, shell: bash }
          - { runner: macos-latest, classifier: osx-aarch64, shell: bash }
          # MSYS2's bash, whose MinGW-w64 compiler the script uses.
          - { runner: windows-latest, classifier: windows-x86_64, shell: 'msys2 {0}' }
    defaults:
      run:
        # From the matrix: the `runner` context is not available in defaults.
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc

      # Only the JNI headers are needed, and every runner image ships a JDK with JAVA_HOME set;
      # jni.h has not changed shape since Java 8.
      - name: Compile natives
        run: bash tools/build-vision-natives.sh

      # The layout packageVisionNatives produces locally, made with the JDK's own jar tool:
      # configuring this Gradle build would need the Android SDK, which these jobs do not.
      - name: Package jar
        run: |
          stage=build/vision-natives-stage/natives/${{ matrix.classifier }}
          mkdir -p "$stage" build/vision-natives-dist
          cp build/vision-natives/*.dylib build/vision-natives/*.so build/vision-natives/*.dll "$stage"/ 2>/dev/null || true
          ls "$stage" | grep -q . || { echo "no natives were built" >&2; exit 1; }
          "$JAVA_HOME/bin/jar" cf build/vision-natives-dist/vision-natives-${{ matrix.classifier }}.jar -C build/vision-natives-stage natives

      - uses: actions/upload-artifact@v7
        with:
          name: vision-natives-${{ matrix.classifier }}
          path: build/vision-natives-dist/vision-natives-${{ matrix.classifier }}.jar
          if-no-files-found: error
