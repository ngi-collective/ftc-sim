/**
 * Top-level build file for ftc_app project.
 *
 * It is extraordinarily rare that you will ever need to edit this file.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

plugins {
    // Note for FTC Teams: Do not modify this yourself.
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()
}

// The native libraries a plain JVM needs before it can run a vision OpMode. Cheap to re-run:
// the script stamps its output and does nothing when it is current. The simulated unit test
// tasks depend on this, so `mise run test` needs no separate step and neither does CI.
tasks.register('buildVisionNatives', Exec) {
    group = 'ftc'
    description = 'Build the desktop OpenCV/AprilTag native libraries into build/vision-natives'
    commandLine 'bash', "${rootDir}/tools/build-vision-natives.sh"

    inputs.file("${rootDir}/tools/build-vision-natives.sh")
    inputs.dir("${rootDir}/tools/vision-natives")
    outputs.dir(layout.buildDirectory.dir('vision-natives'))
}


