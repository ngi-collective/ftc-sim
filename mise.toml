[tools]
# Gradle 9.1 (see gradle/wrapper) rejects the system JDK 25 for the Groovy build scripts it has
# to compile fresh, and AGP 8.13.2 requires JDK 17+. 21 is the LTS both support.
# Building from Android Studio additionally needs Narwhal 3 Feature Drop or later, which is the
# floor SDK 12.0 sets.
java = "temurin-21"

# Pinned, not "latest": the plugin ships cmdline-tools only, and the platform and
# build-tools installed underneath it live in the versioned install directory.
# Bumping this version yields an empty SDK until `mise run setup-sdk` reruns.
android-sdk = "22.0"
bun = "latest"

# Tasks run inside the mise env, so JAVA_HOME and ANDROID_HOME are already set and
# no `mise exec --` prefix is needed. Extra flags pass through: `mise run build --info`.
#
# TeamCode is the only application module (FtcRobotController, TestFramework and Dashboard are
# libraries). It has two product flavors: `robot`, the APK that goes to a competition, and
# `simulated`, which swaps in fake hardware so the app runs on an emulator. Tasks below name the
# flavor explicitly, because "debug" alone is now ambiguous.

[tasks.check]
description = "Compile TeamCode - fastest correctness check while editing OpModes"
run = "./gradlew :TeamCode:compileRobotDebugJavaWithJavac"

[tasks.build]
description = "Build the competition debug APK"
run = "./gradlew :TeamCode:assembleRobotDebug"

[tasks.install]
description = "Build and adb install to a connected Robot Controller device"
run = "./gradlew :TeamCode:installRobotDebug"

[tasks.test]
description = "Run unit tests for TeamCode, the test framework, the dashboard and the camera stream"
run = "./gradlew :TeamCode:testSimulatedDebugUnitTest :TestFramework:testDebugUnitTest :Dashboard:testDebugUnitTest :CameraStream:test"

# Runs the real Robot Controller app against fake hardware on whatever device adb is pointing at -
# in practice an emulator. Create one first (once):
#   sdkmanager "emulator" "system-images;android-30;google_apis;arm64-v8a"
#   avdmanager create avd -n ftc-sim-camera -k "system-images;android-30;google_apis;arm64-v8a"
#
# Then point the AVD's back camera at a host webcam, by editing
# ~/.android/avd/ftc-sim-camera.avd/config.ini:
#   hw.camera.back=webcam0     # `emulator -webcam-list` names the host's cameras
#
# The image must be `google_apis`, not `default`: the AOSP images ship no camera HAL at all, so
# their camera device list is empty and `WebcamFrameSource` has nothing to open. This AVD is only
# needed for the physical-camera oracle; the simulated camera renders its own frames and works on
# any AVD. Vision also needs
# the host OS to allow camera access to whatever launched the emulator - on macOS that is a
# one-time prompt attributed to the terminal or IDE, and until it is granted the guest streams
# black frames rather than failing.
#
#   emulator -avd ftc-sim-camera
[tasks.simulator]
description = "Install and launch the simulated Robot Controller on a running emulator"
run = """
./gradlew :TeamCode:installSimulatedDebug
pkg=com.qualcomm.ftcrobotcontroller.simulated
for permission in CAMERA READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION READ_PHONE_STATE; do
  adb shell pm grant "$pkg" "android.permission.$permission" || true
done
adb shell am start -n "$pkg/org.firstinspires.ftc.teamcode.simulated.SimulatedPermissionValidatorWrapper"
"""

# Vision is the one part of the framework that cannot run on a plain JVM: OpenCV and AprilTag ship
# Android-only native libraries. These are instrumented tests, so they need the emulator above to
# be running, which is why they are not part of `mise run test` or CI.
[tasks.test-vision]
description = "Run every vision test against a running emulator"
run = """
mise run test-acceptance
./gradlew :TestFramework:connectedDebugAndroidTest
"""

# One Gradle invocation per class, deliberately. Each acceptance test builds a VisionPortal with
# LiveView, and the second one in a process fails with "Viewport container specified by user is
# not empty!" -- a portal's viewport is only released when a real OpMode stop tears it down, and
# a portal that an OpMode never closed keeps the container occupied for the life of the process.
[tasks.test-acceptance]
description = "Run unmodified vision OpModes against the simulated camera on an emulator"
run = """
./gradlew :TeamCode:connectedSimulatedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.firstinspires.ftc.teamcode.simulated.RealEventLoopAcceptanceTest
./gradlew :TeamCode:connectedSimulatedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.firstinspires.ftc.teamcode.simulated.SyntheticCameraAcceptanceTest
./gradlew :TeamCode:connectedSimulatedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.firstinspires.ftc.teamcode.simulated.AimedLauncherAcceptanceTest
"""

# The dashboard is two processes -- a JVM serving the simulated robot over a WebSocket, and the
# Vite dev server for the browser UI -- and exactly one way to start them. They were two tasks in
# two terminals until the obvious failure happened: the UI can only reach the socket through its
# own origin, so a JVM started on a different port left the page talking to whatever else was
# listening. tools/dashboard.sh decides the port once and hands it to both halves.
[tasks.dashboard]
description = "Serve the local Driver Hub, UI and simulation together (http://localhost:5183)"
run = "tools/dashboard.sh"

# Without a browser, for scripts and agents driving the socket directly: there is no UI to point
# at the wrong port, so --port is free here. A person wants `mise run dashboard`.
[tasks.dashboard-headless]
description = "Serve only the simulation socket, with no browser UI (ws://localhost:8765)"
run = "./gradlew :TeamCode:dashboard"

[tasks.ci]
description = "Run all tests necessary to pass CI"
depends = ["lint", "test"]

[tasks.lint]
description = "Run Android lint on TeamCode"
run = "./gradlew :TeamCode:lintRobotDebug"

[tasks.clean]
description = "Delete build outputs"
run = "./gradlew :TeamCode:clean"

[tasks.setup-sdk]
description = "Install the SDK packages the build needs into the mise-managed ANDROID_HOME"
run = """
# compileSdkVersion is the source of truth for the platform, same as verify-toolchain.
platform="android-$(sed -nE 's/^[[:space:]]*compileSdkVersion[[:space:]]+([0-9]+).*/\\1/p' build.common.gradle | head -1)"
yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
sdkmanager --sdk_root="$ANDROID_HOME" "platforms;$platform" "build-tools;34.0.0" "platform-tools"
"""
