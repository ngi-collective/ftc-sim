//
// build.gradle in Dashboard
//
// The local Driver Hub replacement: wire protocol plus the WebSocket server that
// drives a simulated robot. Uses the Java-WebSocket and gson copies that already
// ship inside the FTC SDK AARs, so it adds no new dependencies and speaks the same
// stack as the real robot web server.
//
// com.android.library for the same reason as :TestFramework - the SDK is AARs.
//

apply plugin: 'com.android.library'

android {
    namespace = 'org.ngicollective.ftcsim.dashboard'

    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

apply from: '../gradle/sdk.gradle'

dependencies {
    api project(':TestFramework')

    // JPEG and the MJPEG endpoint for the Dashboard Camera View. Its own plain-JVM module because
    // encoding needs javax.imageio, which the android.jar this module compiles against lacks.
    api project(':CameraStream')

    // Working stand-ins for the android.* stubs that throw on a plain JVM.
    testImplementation project(':AndroidShims')

    // Score and body publication are asserted against a real season's field. Test scope only:
    // the dashboard itself learns the season from the robot it serves.
    testImplementation project(':Season-BioBuzz')
}

// Published as org.ngi-collective.ftc-sim:dashboard; see gradle/publish.gradle.
ext.ftcSimArtifact = 'dashboard'
ext.ftcSimDescription = 'The Driver Hub dashboard: a WebSocket server and browser UI for a simulated robot.'
apply from: '../gradle/publish.gradle'

mavenPublishing {
    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary(
            new com.vanniktech.maven.publish.JavadocJar.Empty(),
            new com.vanniktech.maven.publish.SourcesJar.Sources(), 'release'))
}

// The published release variant carries the built Driver Hub UI as resources under dashboard-ui/,
// which DashboardFront serves. Only the release variant: the tests and the in-repository dashboard
// stay free of the bun build, and get the UI from :buildDashboardUi instead.
android.sourceSets.release.resources.srcDir(rootProject.layout.buildDirectory.dir('dashboard-ui'))
tasks.matching { it.name == 'processReleaseJavaRes' }.configureEach {
    dependsOn ':buildDashboardUi'
}
