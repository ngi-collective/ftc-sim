//
// build.gradle in SimulatedApp
//
// The Robot Controller app wired to a simulated robot: the activity, the robot start that skips
// the Wi-Fi Direct wait, the hardware factory and the clock. Library code, so a team's TeamCode
// depends on it from its `simulated` flavour and keeps only its own SimulatedRobot.
//
// FtcRobotController is compileOnly because every team already has it: it is the module in their
// fork that this activity extends, and the app brings it at runtime.
//

apply plugin: 'com.android.library'

android {
    namespace = 'org.ngicollective.ftcsim.app'

    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

apply from: '../gradle/sdk.gradle'

dependencies {
    api project(':TestFramework')

    compileOnly project(':FtcRobotController')

    // @NonNull and @Nullable. A team's TeamCode has them through appcompat, which upstream's
    // build.dependencies.gradle declares; this module compiles alone, so it names them. 1.6.0 is
    // what TeamCode resolves.
    compileOnly 'androidx.annotation:annotation:1.6.0'

    testImplementation project(':AndroidShims')
}
